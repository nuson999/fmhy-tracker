      try {
        var theme = localStorage.getItem("fmhy-theme") || "auto";
        document.documentElement.dataset.theme =
          theme === "auto"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : theme;
      } catch (_) {
        document.documentElement.dataset.theme = matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches
          ? "dark"
          : "light";
      }

    <div class="toolbar" role="region" aria-label="Filters">

        role="group"
        aria-label="Filter changes by type"
      >
        <button
          class="stat-filter active"
          data-filter="all"
          title="Show all tracked changes"
          aria-pressed="true"
        >
          <span class="stat-filter-label">All</span>
          <span class="stat-filter-count" id="total-all">0</span>
        </button>
        <button
          class="stat-filter stat-filter--new"
          data-filter="new"
          title="Newly added links"
          aria-pressed="false"

          <span class="stat-filter-count" id="total-new">0</span>

        <button

          aria-pressed="false"

        </button>
        <button
          class="stat-filter stat-filter--removed"

          aria-pressed="false"

        <button

    <main class="commits" role="main">

        <h2 id="changes-heading" class="visually-hidden">Resource changes</h2>

              id="monthly-loading-spinner"

          </label>
          <div
            class="monthly-message hidden"
            id="monthly-message"
            role="status"
          ></div>
          <button type="button" id="monthly-retry" hidden>Retry history</button>
        </div>
        <p class="last-updated">
          Updated <span id="last-updated">Loading...</span>
        </p>
      </div>
      <div
        id="commits-container"
        role="region"
        aria-labelledby="changes-heading"
        tabindex="-1"

        <div class="skeleton-list" aria-hidden="true">

    </main>

      "message": "fix: New badge only for entries that are actually new (#7463)\n\nThe pill was decided from a URL-keyed map of \"URLs that appeared on an added\ndiff line in the last 30 days\". That is not the same as an entry being new,\nand it produced visible false positives: Metrolist, listed since December\n2024, showed \"New, added 2026-11-25\" on both /mobile and /audio because one\ncommit inserted its link on the audio page, and masscan, ShredOS, APKCombo,\nbookstack and AnimeGO all showed up as new after wording or URL edits to\nlong-standing lines.\n\nWhat changes:\n\n- The map is keyed by page as well as URL (\"mobile.md|https://...\"), so a page\n  that inserts a link no longer badges the same link on every other page that\n  already lists it.\n- An entry only counts as new if its label did not already appear in that file\n  at the parent commit. That covers rewritten bullets (masscan or RustScan),\n  link swaps (GameBounty, CDRomance) and re-lists without any rename detection.\n- docs/.vitepress/added-dates.json holds known first-appearance dates for\n  entries older than the 30-day window, which is what keeps a re-added URL\n  from looking new. It can only make an entry look older, never newer.\n- Anything unresolved stays unbadged instead of falling back to today.\n\nUnchanged: the badge is still a real button with real \"New\" text, so Ctrl+F\nand copy still see it, the cursor stays a pointer, and the li.new hookup and\nthe hover tooltip are untouched.\n\nVerified without a docs build: `node --test tests/new-badge.test.mjs` (16\npassing, covering page scoping, name identity, known dates, renames, removed\nURLs and genuinely new entries), `node scripts/new-badge-report.mjs` (shows\nMetrolist, masscan, APKCombo and ShredOS unbadged while a genuine addition\nkeeps its date), and a one-off replay of the real parent-commit blobs for\nce8a8d73cb, edec9cd231, dd9cf3c51a and 05305b2a5a. A full VitePress build was\nnot run locally.\n\nCo-authored-by: eli32-v
