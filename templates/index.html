<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FMHY Tracker</title>
    <meta
      name="description"
      content="Track changes in the FMHY repository - new, updated, and removed starred links"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./favicon_io/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./favicon_io/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./favicon_io/favicon-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="./favicon_io/android-chrome-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="./favicon_io/android-chrome-512x512.png"
    />
    <link rel="manifest" href="./favicon_io/site.webmanifest" />
    <link rel="icon" type="image/x-icon" href="./favicon_io/favicon.ico" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="FMHY Tracker - Changes Feed"
      href="./feed.xml"
    />
    <script>
      try {
        var theme = localStorage.getItem("fmhy-theme") || "auto";
        document.documentElement.dataset.theme =
          theme === "auto"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : theme;
      } catch (_) {
        document.documentElement.dataset.theme = matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches
          ? "dark"
          : "light";
      }
    </script>
    <link rel="stylesheet" href="{{ css_url }}" />
  </head>
  <body>
    <header role="banner">
      <h1>FMHY Tracker</h1>
      <div class="header-actions">
        <div class="search-container">
          <input
            type="text"
            id="search-input"
            class="search-input"
            placeholder="Search links"
            aria-label="Search links"
          />
          <button
            type="button"
            class="search-clear"
            id="search-clear"
            aria-label="Clear search"
            hidden
          >
            ✕
          </button>
        </div>
        <div class="theme-selector">
          <svg
            class="header-icon"
            viewBox="0 0 16 16"
            aria-hidden="true"
            focusable="false"
          >
            <circle cx="8" cy="8" r="6.25" />
            <path d="M8 1.75a6.25 6.25 0 0 1 0 12.5Z" />
          </svg>
          <label class="theme-label" id="theme-label" for="theme-select"
            >Auto</label
          >
          <select
            id="theme-select"
            class="theme-select"
            aria-label="Select theme"
          >
            <option value="auto">Auto</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </div>
        <a
          class="header-rss"
          href="./feed.xml"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Open RSS Feed"
        >
          <svg
            class="header-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <path
              d="M6.18 15.64a2.18 2.18 0 0 1 2.18 2.18C8.36 19 7.38 20 6.18 20C5 20 4 19 4 17.82a2.18 2.18 0 0 1 2.18-2.18M4 4.44A15.56 15.56 0 0 1 19.56 20h-2.83A12.73 12.73 0 0 0 4 7.27V4.44m0 5.66a9.9 9.9 0 0 1 9.9 9.9h-2.83A7.07 7.07 0 0 0 4 12.93V10.1Z"
            />
          </svg>
        </a>
        <!-- telegram:start -->
        <a
          class="header-telegram"
          href="{{ telegram_url }}"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Get starred link updates on Telegram"
          title="Get starred link updates on Telegram"
        >
          <svg
            class="header-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <path
              d="M2.6 11.1 20.4 4.2c.85-.33 1.6.2 1.33 1.4l-3.04 14.3c-.22 1.02-.83 1.27-1.69.79l-4.66-3.43-2.25 2.16c-.25.25-.46.46-.94.46l.33-4.74 8.64-7.8c.38-.33-.08-.52-.58-.19L6.86 13.9l-4.6-1.44c-1-.31-1.02-1 .34-1.36Z"
            />
          </svg>
        </a>
        <!-- telegram:end -->
      </div>
    </header>

    <!-- Toolbar: type filters (with live counts) -->
    <div class="toolbar" role="region" aria-label="Filters">

      <div
        class="stat-filters"
        role="group"
        aria-label="Filter changes by type"
      >
        <button
          class="stat-filter active"
          data-filter="all"
          title="Show all tracked changes"
          aria-pressed="true"
        >
          <span class="stat-filter-label">All</span>
          <span class="stat-filter-count" id="total-all">0</span>
        </button>
        <button
          class="stat-filter stat-filter--new"
          data-filter="new"
          title="Newly added links"
          aria-pressed="false"
        >
          <span class="stat-filter-label">New</span>
          <span class="stat-filter-count" id="total-new">0</span>
        </button>
        <button
          class="stat-filter stat-filter--updated"
          data-filter="updated"
          title="Updated links"
          aria-pressed="false"
        >
          <span class="stat-filter-label">Updated</span>
          <span class="stat-filter-count" id="total-updated">0</span>
        </button>
        <button
          class="stat-filter stat-filter--removed"
          data-filter="removed"
          title="Removed links"
          aria-pressed="false"
        >
          <span class="stat-filter-label">Removed</span>
          <span class="stat-filter-count" id="total-removed">0</span>
        </button>
        <button
          class="stat-filter stat-filter--starred"
          id="star-toggle"
          type="button"
          title="Show starred sources only"
          aria-pressed="false"
        >
          <span class="stat-filter-label">Starred</span>
        </button>
      </div>
    </div>

    <div class="category-filter-container">
      <div class="mobile-category">
        <select id="category-select" aria-label="Filter by category"></select>
      </div>
      <div class="category-filters-wrapper" id="category-filters-wrapper">
        <div id="category-filters" class="category-filters collapsed">
          <!-- Category buttons will be rendered by JavaScript -->
        </div>
      </div>
      <div class="category-filter-header">
        <button
          class="category-toggle-btn"
          id="category-toggle-btn"
          aria-label="Toggle category filters"
          aria-expanded="false"
          aria-controls="category-filters"
        >
          <span id="category-toggle-text">Show More</span>
          <span class="category-toggle-icon" id="category-toggle-icon">▼</span>
        </button>
      </div>
    </div>

    <main class="commits" role="main">
      <div class="changes-header">
        <h2 id="changes-heading" class="visually-hidden">Resource changes</h2>
        <div class="monthly-toggle-wrapper" id="monthly-toggle-wrapper">
          <label class="monthly-toggle-label">
            <input
              type="checkbox"
              id="monthly-toggle"
              aria-label="Load available month history"
              aria-describedby="monthly-message"
            />
            <span class="monthly-toggle-slider"></span>
            <span class="monthly-toggle-text">Historical</span>
            <span class="monthly-count" id="monthly-count"></span>
            <span
              class="monthly-loading-spinner"
              id="monthly-loading-spinner"
            ></span>
          </label>
          <div
            class="monthly-message hidden"
            id="monthly-message"
            role="status"
          ></div>
          <button type="button" id="monthly-retry" hidden>Retry history</button>
        </div>
        <p class="last-updated">
          Updated <span id="last-updated">Loading...</span>
        </p>
      </div>
      <div
        id="commits-container"
        role="region"
        aria-labelledby="changes-heading"
        tabindex="-1"
      >
        <div class="skeleton-list" aria-hidden="true">
          <div class="skeleton-commit">
            <div class="skeleton skeleton-text short"></div>
            <div class="skeleton skeleton-text medium"></div>
            <div class="skeleton skeleton-text long"></div>
            <div class="skeleton skeleton-text long"></div>
          </div>
          <div class="skeleton-commit">
            <div class="skeleton skeleton-text short"></div>
            <div class="skeleton skeleton-text medium"></div>
            <div class="skeleton skeleton-text long"></div>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer" role="contentinfo">
      <p>
        Tracking
        <a
          class="footer-source"
          href="https://github.com/fmhy/edit"
          target="_blank"
          rel="noopener noreferrer"
          ><svg
            class="footer-icon"
            viewBox="0 0 16 16"
            aria-hidden="true"
            focusable="false"
          >
            <path
              d="M8 0C3.58 0 0 3.65 0 8.16c0 3.61 2.29 6.67 5.47 7.75.4.08.55-.18.55-.4 0-.2-.01-.87-.01-1.59-2.01.44-2.53-.5-2.69-.95-.09-.23-.48-.95-.82-1.14-.28-.15-.68-.52-.01-.53.63-.01 1.08.59 1.23.83.72 1.22 1.87.88 2.33.66.07-.53.28-.88.51-1.08-1.78-.2-3.64-.91-3.64-4.03 0-.89.31-1.61.82-2.18-.08-.2-.36-1.01.08-2.1 0 0 .67-.22 2.2.83.63-.18 1.3-.27 1.97-.27.67 0 1.34.09 1.97.27 1.53-1.05 2.2-.83 2.2-.83.44 1.09.16 1.9.08 2.1.51.57.82 1.29.82 2.18 0 3.13-1.87 3.83-3.65 4.03.29.25.54.74.54 1.49 0 1.08-.01 1.95-.01 2.22 0 .22.15.48.55.4A8.04 8.04 0 0 0 16 8.16C16 3.65 12.42 0 8 0Z"
            /></svg
          >fmhy/edit</a
        >
        on GitHub
      </p>
      <p>
        Have feedback or suggestions?
        <a href="mailto:radar-gulp-woven@duck.com">Send feedback</a>
      </p>
      <p class="build-info">
        Page built <span id="build-time">Loading...</span> - Updates every 6 hours
      </p>
    </footer>

    <button
      type="button"
      class="back-to-top"
      id="back-to-top"
      aria-label="Back to top"
      title="Back to top"
    >
      ↑
    </button>

    <!-- prettier-ignore -->
    <script src="{{ js_url }}" defer></script>
    <script id="fmhy-data" type="application/json">
      {{ data_json }}
    </script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        var fmhyData = JSON.parse(
          document.getElementById("fmhy-data").textContent,
        );
        init(fmhyData);
      });
    </script>
  </body>
</html>
