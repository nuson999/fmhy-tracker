# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Triggered by the monitor workflow
  repository_dispatch:
    types: [deploy-static]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.sha || github.sha }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        env:
          EXPECTED_SHA: ${{ github.event.client_payload.sha || github.sha }}
        run: |
          DEPLOYED_SHA="$(git rev-parse HEAD)"
          if [ "$EXPECTED_SHA" != "$DEPLOYED_SHA" ]; then
            echo "Requested revision $EXPECTED_SHA but checked out $DEPLOYED_SHA" >&2
            exit 1
          fi
          mkdir -p public
          cp index.html feed.xml fmhy_data.json monthly_commits.json public/
          cp -r favicon_io public/favicon_io
          cp -r static public/static
          printf '{"requested_sha":"%s","deployed_sha":"%s"}\n' \
            "$EXPECTED_SHA" "$DEPLOYED_SHA" > public/deployment-revision.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "public"

      - name: Confirm revision is current
        env:
          EXPECTED_SHA: ${{ github.event.client_payload.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
        run: |
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          CURRENT_SHA="$(git rev-parse FETCH_HEAD)"
          if [ "$EXPECTED_SHA" != "$CURRENT_SHA" ]; then
            echo "Refusing stale deployment $EXPECTED_SHA; default branch is $CURRENT_SHA" >&2
            exit 1
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
