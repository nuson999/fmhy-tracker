name: Monitor fmhy/edit Commits

on:
  schedule:
    # Every 6 hours at :17 (off the busy top of the hour)
    # 00:17, 06:17, 12:17, 18:17 UTC = 09:17, 15:17, 21:17, 03:17 KST
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual triggering
    inputs:
      backfill:
        description: "Run monthly backfill (fetches all commits from current month)"
        required: false
        default: false
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run lint checks
        run: |
          ruff format --check .
          ruff check .

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run frontend regression checks
        run: node --test tests/frontend.test.cjs

  monitor:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py

      - name: Generate monthly aggregate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py --generate-monthly

      - name: Backfill monthly data (manual trigger only)
        if: ${{ github.event.inputs.backfill == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py --backfill-monthly

      - name: Commit and push last commit SHA and generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add last_commit_sha.txt fmhy_data.json index.html feed.xml monthly_commits.json data/ static/dist/
          git diff --staged --quiet || (git commit -m "Update tracker data and webpage" && git push) || echo "No changes to commit or push failed"

      - name: Trigger GitHub Pages deployment
        run: |
          curl -X POST \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.everest-preview+json" \
          -d '{"event_type": "deploy-static"}' \
          https://api.github.com/repos/${{ github.repository }}/dispatches
